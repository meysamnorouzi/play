<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>آفلاین - Digi Parent</title>
  <meta name="theme-color" content="#237147" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      color: #166534;
    }
    .icon { width: 80px; height: 80px; margin-bottom: 24px; opacity: 0.8; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    p { color: #15803d; margin-bottom: 24px; text-align: center; }
    button {
      padding: 12px 24px;
      background: #237147;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #1d5f3a; }
  </style>
</head>

  <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">

  </svg>
  <h1>اتصال به اینترنت برقرار نیست</h1>
  <p>لطفاً اتصال اینترنت خود را بررسی کرده و دوباره تلاش کنید.</p>
  <button onclick="window.location.reload()">تلاش مجدد</button>

</html>
