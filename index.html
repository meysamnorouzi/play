<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Primary Meta Tags -->
    <title>Digi Parent</title>
    <meta name="title" content="Digi Parent" />
    <meta name="description" content="با استفاده از این اپلیکیشن میتوانید به راحتی به تمام امکانات دسترسی داشته باشید" />
    <meta name="keywords" content="parental control, children, family, education" />
    <meta name="author" content="Digi Parent" />
    
    <!-- Favicon - SVG for modern browsers -->
    <link rel="icon" type="image/svg+xml" href="./icon/parent-logo.svg" />
    <!-- Fallback favicon for older browsers (if you add favicon.ico later) -->
    <link rel="alternate icon" type="image/png" href="./icon/parent-logo.svg" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#237147" />
    <meta name="msapplication-TileColor" content="#237147" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    
    <!-- Apple iOS / Safari PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Digi Parent" />
    <!-- Note: Apple touch icons should ideally be PNG files, but SVG is used here -->
    <link rel="apple-touch-icon" href="./icon/parent-logo.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icon/parent-logo.svg" />
    <link rel="apple-touch-icon" sizes="152x152" href="./icon/parent-logo.svg" />
    <link rel="apple-touch-icon" sizes="144x144" href="./icon/parent-logo.svg" />
    <link rel="apple-touch-icon" sizes="120x120" href="./icon/parent-logo.svg" />
    <link rel="apple-touch-icon" sizes="114x114" href="./icon/parent-logo.svg" />
    <link rel="apple-touch-icon" sizes="76x76" href="./icon/parent-logo.svg" />
    <link rel="apple-touch-icon" sizes="72x72" href="./icon/parent-logo.svg" />
    <link rel="apple-touch-icon" sizes="60x60" href="./icon/parent-logo.svg" />
    <link rel="apple-touch-icon" sizes="57x57" href="./icon/parent-logo.svg" />
    <!-- Safari pinned tab icon -->
    <link rel="mask-icon" href="./icon/parent-logo.svg" color="#237147" />
    
    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileImage" content="./icon/parent-logo.svg" />
    <meta name="msapplication-square70x70logo" content="./icon/parent-logo.svg" />
    <meta name="msapplication-square150x150logo" content="./icon/parent-logo.svg" />
    <meta name="msapplication-wide310x150logo" content="./icon/parent-logo.svg" />
    <meta name="msapplication-square310x310logo" content="./icon/parent-logo.svg" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta property="og:title" content="Digi Parent" />
    <meta property="og:description" content="با استفاده از این اپلیکیشن میتوانید به راحتی به تمام امکانات دسترسی داشته باشید" />
    <meta property="og:image" content="./icon/parent-logo.svg" />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:site_name" content="Digi Parent" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="/" />
    <meta name="twitter:title" content="Digi Parent" />
    <meta name="twitter:description" content="با استفاده از این اپلیکیشن میتوانید به راحتی به تمام امکانات دسترسی داشته باشید" />
    <meta name="twitter:image" content="./icon/parent-logo.svg" />
    
    <!-- Mobile Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Digi Parent" />
    
    <!-- PWA manifest is injected by vite-plugin-pwa during build -->
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
